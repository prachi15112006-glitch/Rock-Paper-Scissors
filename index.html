<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors Game </title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <div class="choices">
    <div class="choice" id="scissors">
    <img src="https://media.istockphoto.com/id/165033276/vector/victory-hand-gesture.jpg?s=612x612&w=0&k=20&c=SDhWCHf5ETwh62VW0uHPwH15oCnGGmQGJR4u-SWqWZw="/>
  </div>
   
    <div class="choice" id="paper">
    <img src="https://www.clipartkey.com/mpngs/m/57-579777_handprint-clipart-purple-palm-hand-clip-art.png"/>
  </div>
   
    <div class="choice" id="rock">
    <img src="https://tse2.mm.bing.net/th/id/OIP.dgANV3SUBlOal8E5LMaxqgHaHI?r=0&pid=ImgDet&w=172&h=165&c=7&dpr=1.9&o=7&rm=3"/>
  </div>
</div>

<div class="score-board">
  <div class="score">
    <p id="user-score">0</p>
    <p>You</p>
  </div>

  <div class="score">
    <p id="comp-score">0</p>
    <p>Comp</p>
  </div>
</div>

<div class="msg-container">
  <p id="msg">Play your move</p>
</div>
<script src="first.js"></script>
</body>
</html>
